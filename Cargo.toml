[package]
name = "carrusel"
description = "Creador de carruseles panorámicos para Instagram (estilo SCRL)"
version = "0.2.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
epaint_default_fonts = "0.37"
log = "0.4"
miniz_oxide = "0.8.9"
resvg = { version = "0.49.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Mac, Windows y Linux: app nativa (wgpu/Metal), diálogos del sistema.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = "0.37.0"
image = "0.25.10"
pollster = "1"
rfd = "0.18.0"

# Versión web (iPad y navegadores): WebGL, sin hilos ni procesos externos.
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
base64 = "0.22"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "Storage", "Window"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Versión web: igual que release pero conserva la sección `target_features`
# que wasm-bindgen necesita (Trunk la usa vía `data-cargo-profile`).
[profile.web-release]
inherits = "release"
strip = "debuginfo"
