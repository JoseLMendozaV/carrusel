[package]
name = "carrusel"
description = "Creador de carruseles panorámicos para Instagram (estilo SCRL)"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
eframe = "0.37.0"
epaint_default_fonts = "0.37"
image = "0.25.10"
miniz_oxide = "0.8.9"
resvg = { version = "0.49.0", default-features = false }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
strip = true
